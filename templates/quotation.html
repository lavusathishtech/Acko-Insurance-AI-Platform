<!-- templates/quotation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Predictor - ACKO AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="fa-solid fa-shield-halved text-primary me-2 fs-3"></i>
                <span class="fw-bold fs-4 text-dark">ACKO<span class="text-primary">AI</span></span>
            </a>
            <div class="ms-auto">
                <a href="/dashboard" class="btn btn-outline-custom btn-rounded btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row mb-4 text-center">
            <div class="col-12">
                <h1 class="fw-bold">Premium Estimator</h1>
                <p class="text-muted">Calculate policy price instantly using customized IDV and NCB parameters.</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="row g-4">
                    <!-- Left: Parameters Form -->
                    <div class="col-md-6">
                        <div class="glass-panel p-4">
                            <h4 class="fw-bold mb-3">Vehicle details</h4>
                            
                            <form id="premium-quote-form">
                                <div class="form-group-custom">
                                    <label for="v-type">Vehicle Type</label>
                                    <select id="v-type" name="vehicle_type" class="form-control-custom" required>
                                        <option value="Car">Car</option>
                                        <option value="Bike">Bike</option>
                                    </select>
                                </div>
                                <div class="form-group-custom">
                                    <label for="v-model">Vehicle Model</label>
                                    <input type="text" id="v-model" name="vehicle_model" class="form-control-custom" placeholder="Honda Amaze" value="Honda Amaze" required>
                                </div>
                                <div class="form-group-custom">
                                    <label for="reg-year">Registration Year</label>
                                    <input type="number" id="reg-year" name="registration_year" class="form-control-custom" value="2022" required>
                                </div>
                                <div class="form-group-custom">
                                    <label for="f-type">Fuel Type</label>
                                    <select id="f-type" name="fuel_type" class="form-control-custom" required>
                                        <option>Petrol</option>
                                        <option>Diesel</option>
                                        <option>CNG</option>
                                        <option>Electric</option>
                                    </select>
                                </div>
                                <div class="form-group-custom">
                                    <label for="city-val">City</label>
                                    <input type="text" id="city-val" name="city" class="form-control-custom" value="Bengaluru" required>
                                </div>
                                <div class="form-group-custom">
                                    <label for="idv-val">IDV (Insured Declared Value)</label>
                                    <input type="number" id="idv-val" name="idv" class="form-control-custom" value="450000" min="10000" step="5000" required>
                                </div>
                                <div class="form-group-custom">
                                    <label for="ncb-val">No Claim Bonus (NCB)</label>
                                    <select id="ncb-val" name="ncb" class="form-control-custom" required>
                                        <option value="0">0%</option>
                                        <option value="20" selected>20%</option>
                                        <option value="25">25%</option>
                                        <option value="35">35%</option>
                                        <option value="45">45%</option>
                                        <option value="50">50%</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary-custom btn-rounded w-100 mt-3 py-2">Predict Premium</button>
                            </form>
                        </div>
                    </div>

                    <!-- Right: Premium Value Breakdown -->
                    <div class="col-md-6">
                        <div class="glass-panel p-4 h-100 d-flex flex-column justify-content-center text-center">
                            <div id="quote-result-card" style="display: none;">
                                <i class="fa-solid fa-receipt text-primary mb-3" style="font-size:3.5rem;"></i>
                                <span class="text-muted small d-block">Estimated Premium (incl. GST)</span>
                                <h2 class="fw-bold text-dark mb-4" id="premium-value">₹--</h2>
                                
                                <div class="border-top pt-3 text-start" id="premium-breakdown">
                                    <!-- Populated dynamically via script.js -->
                                </div>
                            </div>
                            <div id="quote-placeholder">
                                <i class="fa-solid fa-calculator text-muted mb-3" style="font-size:4rem;"></i>
                                <h5 class="text-muted">Fill out the vehicle form to estimate policy price</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spinner Loading Overlay -->
    <div id="loading-spinner-overlay" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-50" style="display: none !important; z-index: 1060;">
        <div class="spinner-custom text-primary" role="status"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
