<!-- templates/customer_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - ACKO AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="fa-solid fa-shield-halved text-primary me-2 fs-3"></i>
                <span class="fw-bold fs-4 text-dark">ACKO<span class="text-primary">AI</span></span>
            </a>
            <div class="ms-auto">
                <a href="/" class="btn btn-outline-custom btn-rounded btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Home</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container login-container">
        <div class="row w-100 align-items-center">
            <!-- Left Side Illustration -->
            <div class="col-lg-6 text-center d-none d-lg-block">
                <img src="/static/images/login_ill.svg" alt="Login Illustration" class="login-illustration" style="max-height: 420px; width: 100%;" onerror="this.src='https://illustrations.popsy.co/blue/customer-support.svg'">
            </div>
            
            <!-- Right Side Glass Card -->
            <div class="col-lg-6 d-flex justify-content-center">
                <div class="glass-panel login-card">
                    <!-- Login Section -->
                    <div id="login-section">
                        <h2 class="fw-bold mb-2">Welcome Back</h2>
                        <p class="text-muted small mb-4">Login to view policies, file claims, or estimate premium values.</p>
                        
                        <form id="customer-login-form">
                            <div class="form-group-custom">
                                <label for="login-email">Email Address</label>
                                <input type="email" id="login-email" name="email" class="form-control-custom" placeholder="name@domain.com" required>
                            </div>
                            <div class="form-group-custom">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" name="password" class="form-control-custom" placeholder="••••••••" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember-me">
                                    <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
                                </div>
                                <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary-custom btn-rounded w-100 py-2">Login Account</button>
                        </form>
                    </div>

                    <!-- Register Section -->
                    <div id="register-section" style="display: none;">
                        <h2 class="fw-bold mb-2">Create Account</h2>
                        <p class="text-muted small mb-4">Sign up to buy comprehensive AI policies instantly.</p>
                        
                        <form id="customer-register-form">
                            <div class="form-group-custom">
                                <label for="reg-name">Full Name</label>
                                <input type="text" id="reg-name" name="full_name" class="form-control-custom" placeholder="Alex Mercer" required>
                            </div>
                            <div class="form-group-custom">
                                <label for="reg-email">Email Address</label>
                                <input type="email" id="reg-email" name="email" class="form-control-custom" placeholder="name@domain.com" required>
                            </div>
                            <div class="form-group-custom">
                                <label for="reg-phone">Phone Number</label>
                                <input type="tel" id="reg-phone" name="phone" class="form-control-custom" placeholder="+91 98765 43210" required>
                            </div>
                            <div class="form-group-custom">
                                <label for="reg-password">Password</label>
                                <input type="password" id="reg-password" name="password" class="form-control-custom" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary-custom btn-rounded w-100 py-2 mt-2">Register Account</button>
                        </form>
                    </div>

                    <hr class="my-4">
                    <div class="text-center">
                        <a href="#" id="toggle-auth-mode" class="small text-primary text-decoration-none fw-bold">Don't have an account? Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spinner Loading Overlay -->
    <div id="loading-spinner-overlay" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-50" style="display: none !important; z-index: 1060;">
        <div class="spinner-custom text-primary" role="status"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
