<!-- templates/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Login - ACKO AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-login-card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .form-control-dark {
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }
        .form-control-dark:focus {
            border-color: #2684ff;
            background: #1f2937;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(38, 132, 255, 0.2);
        }
        .btn-blue {
            background: #2684ff;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-blue:hover {
            background: #0052cc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="admin-login-card text-center">
        <i class="fa-solid fa-lock text-primary mb-3" style="font-size:3rem;"></i>
        <h2 class="fw-bold mb-2">Manager Console</h2>
        <p class="text-muted small mb-4">Secure administrator authentication portal.</p>
        
        <form id="admin-login-form" class="text-start">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Manager Email</label>
                <input type="email" name="email" class="form-control-dark" placeholder="admin@acko.demo" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Password</label>
                <input type="password" name="password" class="form-control-dark" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-blue w-100 py-2">Authenticate</button>
        </form>
    </div>

    <!-- Spinner Loading Overlay -->
    <div id="loading-spinner-overlay" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-50" style="display: none !important; z-index: 1060;">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
